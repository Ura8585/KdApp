services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kdb-backend
    restart: always
    ports:
      - "8968:5237"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5237
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5432;Database=kbrddbapp;Username=postgres;Password=8585
    extra_hosts:
      - "host.docker.internal:host-gateway"